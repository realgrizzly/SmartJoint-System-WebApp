<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการข้อมูลผู้ป่วย | นักกายภาพบำบัดห</title>

    <link rel="stylesheet" href="../CSS/Physio/physio_managepatient.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <header class="main-header">
        <div class="container-head">
            <h2>วัดมุมการเคลื่อนไหวข้อศอกและข้อเข่าด้วยเซนเซอร์</h2>
        </div>
        
        <div class="user-container">
            <div class="profile">
                <p>นักกายภาพบำบัด : <span id="user-name">กำลังโหลด...</span></p>
            </div>
            
            <div class="logout">
                <button onclick="Logout()">ออกจากระบบ</button>
            </div>
        </div>
    </header>
    
    <div class="line-under"></div>
    
    <div class="main-body">
        <div class="navbar">
            <ul>
                <li><a href="../public/physio_home.html">
                    <i class="fa-solid fa-house"></i>หน้าแรก</a>
                </li>
                <li class="active"><a href="physio_managepatient.html">
                    <i class="fa-solid fa-user-injured"></i>จัดการข้อมูลผู้ป่วย</a>
                </li>
            </ul>
        </div>
        
        <div class="main-content">
            <div class="manage-container">
                <h3 class="manage-title">รายชื่อของผู้ป่วยที่นักกายภาพบำบัด <span id="header-physio-name">...</span> ดูแล</h3>
                
                <div class="table-responsive">
                    <table class="patient-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>ชื่อ-นามสกุล</th>
                                <th>รหัสผู้ป่วย</th>
                                <th>เพศ</th>
                                <th>ประเภทการวัด</th>
                                <th>ตำแหน่ง</th>
                                <th>ท่ากายภาพบำบัด</th>
                                <th>เบอร์ติดต่อ</th>
                                <th>วันที่ได้รับการรักษา</th>
                                <th>ดำเนินการ</th>
                            </tr>
                        </thead>
                        
                        <tbody id="patient-table-body">
                            <tr>
                                <td class="patient-detail" colspan="10">กำลังโหลดข้อมูล...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-auth-compat.js"></script>
    <script src="../config/firebase-config.js"></script>
    <script src="../JS/Check-physio.js"></script>
    <script src="../JS/physio_managepatient.js"></script>
    <script src="../JS/Logout.js"></script>

</body>
</html>
