<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลืมรหัสผ่าน</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="ForgotPassword.css">
</head>

<body>
    <div class="container">
        <div class="left">
            <div class="left-content">
                <div class="logo">
                    <span>JOINT MOTION</span> 
                </div>
                <h1>ลืมรหัสผ่าน</h1>
                <p>
                กรอกข้อมูลเพื่อรีเซ็ตรหัสผ่าน
            </p>
            </div>
        </div>
        <div class="right">
            <div class="login-box">
                <h2>ลืมรหัสผ่าน</h2>
                <p class="subtitle">กรอกชื่อผู้ใช้หรืออีเมล</p>
            <form>
                <label>ชื่อผู้ใช้ หรือ อีเมล</label>
                <div class="input-group">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="forgotInput" placeholder="Email">
            </div>

            <p id="forgotMessage"></p>

            <button type="button" onclick="handleForgotPassword()">ยืนยัน</button>
            
            <div class="option">
                <div class="login-page">
                    <a href="../public/Login.html">เข้าสู่ระบบ</a>
            </div>
            </div>
        </form>
        </div>
    </div>
</div>

    <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-auth-compat.js"></script>
  
    <script src="../config/firebase-config.js"></script>
    <script src="ForgotPassword.js"></script>
</body>
</html>
