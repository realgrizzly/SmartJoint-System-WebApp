<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="../CSS/Login.css">
</head>

<body>
    <div class="container">
        <div class="left">
            <div class="left-content">
                <div class="logo">
                    <span>JOINT MOTION</span>
                </div>
                
                <h1>วัดมุมการเคลื่อนไหวข้อศอกและข้อเข่าด้วยเซนเซอร์</h1>
                <p>
                    เข้าสู่ระบบเพื่อจัดการข้อมูลผู้ป่วย
                    ตรวจสอบผลการวัดมุมข้อต่อ และติดตามผลการรักษา
                </p>
            </div>
        </div>
    
        <div class="right">
            <div class="login-box">
                
                <h2>ลงชื่อเข้าใช้งานระบบ</h2>
                <p class="subtitle">กรอกชื่อผู้ใช้และรหัสผ่าน</p>
            
                <form>
                    <label>ชื่อผู้ใช้</label>
                    <div class="input-group">
                        <i class="fa-regular fa-user"></i>
                        <input type="text" id="username" placeholder="Username">
                    </div>
                
                    <label>รหัสผ่าน</label>
                
                    <div class="input-group">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="Password">
                    </div>
                    
                    <p id="errorMessage" style="display:none;color:red;margin:10px 0;">
                        ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง!
                    </p>
                    
                    <div class="option">
                        <label class="remember">
                            <input type="checkbox">จดจำฉันไว้</label>
                            <a href="../ForgotPassword/forgotpassword.html">ลืมรหัสผ่าน</a>
                    </div>
                    
                    <button type="button" onclick="handleLogin()">เข้าสู่ระบบ<i class="fa-solid fa-arrow-right"></i></button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-storage-compat.js"></script>
    <script src="../../config/firebase-config.js"></script>
    <script src="../JS/Login.js"></script>

</body>
</html>
