<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการอุปกรณ์ | Admin</title>

    <link rel="stylesheet" href="../../CSS/Admin/admin_menu2.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    <header class="main-header">
        <div class="container-head">
            <h2>JOINT MOTION SYSTEM</h2>
        </div>
        
        <div class="user-container">
            <div class="profile">
                <p>แอดมิน: <span id="user-name">กำลังโหลด...</span></p>
            </div>
            
            <div class="logout">
                <button onclick="Logout()">ออกจากระบบ</button>
            </div>
        </div>
    </header>
    
    <div class="line-under"></div>
    
    <div class="main-body">
        <div class="navbar">
            <ul>
                <li><a href="../../public/admin_home.html"><i class="fa-solid fa-house"></i>หน้าเมนู Dashboard</a></li>
                <li class="active"><a href="../AdminMenu2/Admin_menu2.html"><i class="fa-solid fa-microchip" style="color: rgb(19, 20, 19);"></i>
                     จัดการอุปกรณ์และตรวจสอบสถานะ</a>
                </li>
            </ul>
        </div>
        
        <div class="main-content">
            <h2>ข้อมูลอุปกรณ์และสถานะการใช้งาน</h2>
            
            <div class="table">
                <table border="1">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>ชื่ออุปกรณ์</th>
                            <th>สถานะการใช้งาน</th>
                            <th>แบตเตอรี่</th>
                            <th>อัปเดตล่าสุด</th>
                            <th>ดำเนินการ</th>
                        </tr>
                    </thead>
                    
                    <tbody id="table-device">
                        <tr>
                            <td colspan="6">กำลังโหลดข้อมูล...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <div class="button-add">
                <button onclick="addDevice()">เพิ่มข้อมูลอุปกรณ์</button>
            </div>
        </div>
    </div>
    
    <script src="../../config/firebase-config.js"></script>
    <script src="../../JS/Admin_manage_device.js"></script>
    <script src="../../JS/Logout.js"></script>
    <script src="../../JS/Check-admin.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-auth-compat.js"></script>
</body>
</html>
